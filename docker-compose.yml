# Letterboxd Review Reader
#
# Build & run:      docker compose up -d --build
# Logs:             docker compose logs -f web
# Stop:             docker compose down   (the `letterboxd-data` volume is kept)
#
# The SQLite database lives on a named volume mounted at /data, so it
# survives container restarts and rebuilds.

services:
  web:
    build: .
    image: letterboxd-review-reader:latest
    ports:
      - "3000:3000"
    environment:
      # SQLite database location (persisted via the named volume below).
      DATABASE_PATH: /data/letterboxd.db
      # Optional: only needed for TMDB search. Set in a `.env` file next to
      # this compose file (TMDB_READ_ACCESS_TOKEN=...) and uncomment:
      # TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
    volumes:
      - letterboxd-data:/data
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Alternative: Tailscale sidecar (instead of exposing port 3000 on the host)
  #
  # Uncomment to put the app on your tailnet only — nothing is exposed
  # publicly or on the host's network interfaces. Access it at
  # http://<container-name>:3000 from any device in your tailnet ( MagicDNS).
  #
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   container_name: tailscale
  #   hostname: letterboxd-reader
  #   environment:
  #     TS_AUTHKEY: ${TS_AUTHKEY}        # from https://login.tailscale.com/admin/authkeys
  #     TS_EXTRA_ARGS: --advertise-tags=tag:container
  #     TS_STATE_DIR: /var/lib/tailscale
  #   volumes:
  #     - tailscale-state:/var/lib/tailscale
  #   network_mode: "service:web"        # share the web container's network
  #   restart: unless-stopped
  #
  # (If you use the sidecar, remove the `ports:` mapping above and add
  # `depends_on: [tailscale]` to the web service.)
  #
  # Simpler option on a host that already runs Tailscale: keep the app bound
  # to localhost only and publish it over HTTPS with Tailscale Serve:
  #
  #   1. In docker-compose.yml, change `ports` to `["127.0.0.1:3000:3000"]`
  #   2. Run:  sudo tailscale serve --bg 3000
  #      (or:  sudo tailscale serve --bg http://localhost:3000 )
  #   3. The app is now at https://<machine-name>.<tailnet>.ts.net
  #   4. Check/clear with: tailscale serve status | tailscale serve reset
  # -------------------------------------------------------------------------

volumes:
  letterboxd-data:
  # tailscale-state:
